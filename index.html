<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>سامانه کارنامه</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body class="login-page">


    <main id="login-view">


        <div class="login-container">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="logo.png"
                    alt="لوگوی سامانه"
                    class="site-logo"
                >

            </div>


            <!-- TITLE -->

            <h1>
                سامانه کارنامه
            </h1>


            <p class="login-subtitle">
                برای مشاهده کارنامه‌های خود وارد شوید.
            </p>


            <!-- LOGIN FORM -->

            <form id="login-form">


                <div class="form-group">

                    <label for="username">
                        نام کاربری
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="نام کاربری خود را وارد کنید"
                        autocomplete="username"
                        dir="ltr"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="رمز عبور خود را وارد کنید"
                        autocomplete="current-password"
                        dir="ltr"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="login-button"
                >
                    ورود
                </button>


                <p
                    id="login-error"
                    class="error-message"
                    hidden
                ></p>


            </form>


        </div>


    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- CONFIG -->

    <script src="config.js"></script>


    <!-- LOGIN JAVASCRIPT -->

    <script src="app.js"></script>


</body>

</html>
