<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Secure score sheet portal">
  <title>Score Sheet Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section id="login-view" class="card">
      <div class="brand">Score Sheet Portal</div>
      <h1>Sign in</h1>
      <p class="muted">Enter your username and password to view your score sheet.</p>
      <form id="login-form" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" inputmode="numeric" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="login-button">Sign in</button>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="dashboard-view" class="card" hidden>
      <div class="topbar">
        <div>
          <div class="brand">Score Sheet Portal</div>
          <h1 id="welcome">Welcome</h1>
        </div>
        <button id="logout-button" class="secondary">Log out</button>
      </div>
      <div class="score-card">
        <div class="pdf-icon">PDF</div>
        <div>
          <h2>My Score Sheet</h2>
          <p class="muted">Your personal score sheet is ready to view.</p>
        </div>
      </div>
      <button id="view-pdf-button" class="primary">View my score sheet</button>
      <p id="dashboard-error" class="error" role="alert" hidden></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
